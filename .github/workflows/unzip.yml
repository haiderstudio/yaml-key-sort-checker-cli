# Unzip workflow: extracts the repo zip and commits its files
name: Unzip repo files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          set -e
          mkdir -p extracted_tmp
          unzip -o yaml-key-sort-checker-cli.zip -d extracted_tmp
          CI_FILE=$(find extracted_tmp -path '*/.github/workflows/ci.yml' | head -n 1)
          echo "--- ci.yml ---"
          cat "$CI_FILE"
          rm "$CI_FILE"
          WRAPPED=""
          if [ ! -f extracted_tmp/README.md ]; then
            for d in extracted_tmp/*/; do
              [ -d "$d" ] || continue
              if [ -f "${d}README.md" ] && [ -d "${d}src" ]; then
                WRAPPED="$d"
                break
              fi
            done
          fi
          if [ -n "$WRAPPED" ]; then
            cp -a "$WRAPPED". .
          else
            cp -a extracted_tmp/. .
          fi
          rm -f yaml-key-sort-checker-cli.zip
          rm -rf extracted_tmp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add yaml-key-sort-checker-cli files" || echo "Nothing to commit"
          git push
